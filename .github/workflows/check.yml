# Catches environment rot: re-checks the golden values
# on every push and pull request, and once a month.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Golden values
        run: |
          uv sync --locked
          uv run pytest -q
