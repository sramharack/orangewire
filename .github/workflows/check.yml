# Catches environment rot: re-checks the golden values and rebuilds the PDF
# on every push and pull request, and once a month.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

env:
  TYPST_VERSION: "0.15.0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Golden values
        run: |
          uv sync --locked
          uv run pytest -q

      - name: Install Typst
        run: |
          curl -sSL -o typst.tar.xz "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar xf typst.tar.xz
          echo "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Build PDF
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: orangewire-pdf
          path: build/orangewire.pdf
